<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สถานที่ท่องเที่ยว — Travel and Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/place.css?v=2">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>

<main class="section">
  <div class="container">
    <p id="status" role="status" class="muted" style="padding:2rem 0;text-align:center;">กำลังโหลดข้อมูลสถานที่ท่องเที่ยว...</p>
    
    <article id="place" hidden>
      <!-- Hero Header -->
      <div class="place-hero">
        <h1 id="name" class="place-title-th"></h1>
        <p id="name-en" class="place-title-en"></p>
        <div id="place-badges" class="place-badges-row"></div>
      </div>

      <!-- Photo Gallery -->
      <div id="gallery" class="gallery"></div>

      <!-- Highlights Section -->
      <section id="highlights-container" class="highlights-section" hidden>
        <h2>✨ จุดเด่นและไฮไลท์สำคัญ (Highlights)</h2>
        <div id="highlights-grid" class="highlights-grid"></div>
      </section>

      <!-- Main Content Grid -->
      <div class="grid grid-2">
        <div class="stack">
          <!-- About Narrative -->
          <section class="place-about-card">
            <h2>📖 ประวัติและความเป็นมา</h2>
            <p id="description"></p>
          </section>

          <!-- Visitor Information -->
          <section class="visitor-card">
            <h2>ℹ️ ข้อมูลสำหรับผู้มาเยือน</h2>
            <div id="visitor-list" class="visitor-list"></div>
          </section>

          <!-- Quests Available -->
          <section class="place-quests-card">
            <h2>🎯 เควสท์ & ภารกิจในสถานที่นี้</h2>
            <ul id="quests" class="place-quests-list"></ul>
          </section>

          <!-- Campaigns -->
          <section class="place-quests-card" id="campaigns-section">
            <h2>🏆 แคมเปญพิเศษ</h2>
            <ul id="campaigns" class="place-quests-list"></ul>
          </section>

          <!-- Action Buttons -->
          <div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:0.5rem;">
            <a class="btn" id="btn-nav" href="#" style="background:linear-gradient(135deg,#00A86B,#007A4D);font-size:1rem;padding:0.75rem 1.4rem;">
              🧭 นำทาง GPS ไปที่นี่
            </a>
            <a class="btn" id="btn-trip" href="/planner.html" style="font-size:1rem;padding:0.75rem 1.4rem;">
              📅 วางแผนทริป
            </a>
            <a class="btn btn-secondary" id="btn-write-journal" href="/journal.html" style="font-size:1rem;padding:0.75rem 1.4rem;">
              📖 บันทึกไดอารี่
            </a>
          </div>
        </div>

        <!-- Sidebar: Map & Location -->
        <div>
          <div style="position:sticky;top:80px;">
            <div id="map-error" class="alert alert-error" role="alert" hidden></div>
            <div id="map" class="place-map"></div>
            <div style="margin-top:1rem;background:#FFFFFF;padding:1.25rem;border-radius:14px;border:1px solid #E2E8F0;box-shadow:0 2px 8px rgba(0,0,0,0.04);">
              <h3 style="font-size:1rem;font-weight:700;margin:0 0 0.5rem;color:#0F172A;">📍 พิกัดทางภูมิศาสตร์</h3>
              <p id="coords" class="meta" style="font-size:0.9rem;color:#475569;margin:0;"></p>
              <div id="transportation-box" style="margin-top:0.85rem;padding-top:0.85rem;border-top:1px solid #F1F5F9;" hidden>
                <strong style="font-size:0.85rem;color:#059669;display:block;margin-bottom:0.25rem;">🚆 การเดินทางสาธารณะ:</strong>
                <p id="transportation-text" style="font-size:0.88rem;color:#334155;margin:0;line-height:1.45;"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </article>
  </div>
</main>

<footer id="site-footer"></footer>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/place.js?v=2"></script>
</body>
</html>
