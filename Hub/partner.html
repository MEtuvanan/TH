<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สำหรับผู้ประกอบการ — Travel and Challenge</title>
<meta name="description" content="เพิ่มสถานที่และเควสท์ของคุณเอง รอการอนุมัติจากแอดมิน ดูสถิติผู้มาเช็คอินในแดชบอร์ดของคุณ">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/partner.css">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>

<main id="partner-main">
  <!-- Views injected by JS: #view-apply | #view-pending | #view-dashboard -->
  <div id="partner-loader" style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
    <div style="text-align:center;">
      <div style="font-size:2.5rem;margin-bottom:0.75rem;animation:spin 1.2s linear infinite;display:inline-block;">🔄</div>
      <p style="color:#64748B;">กำลังตรวจสอบสถานะบัญชีผู้ประกอบการ...</p>
    </div>
  </div>
</main>

<!-- Map Picker Dialog (shared) -->
<dialog id="map-picker-dialog" style="width:min(680px,96vw);border-radius:16px;border:none;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
  <h2 style="margin:0 0 0.35rem;">🗺️ ปักหมุดตำแหน่งสถานที่ของคุณ</h2>
  <p style="font-size:0.85rem;color:#64748B;margin:0 0 0.85rem;">แตะหรือคลิกบนแผนที่เพื่อปักหมุด หรือลากหมุดไปยังตำแหน่งที่ต้องการ</p>
  <div id="partner-map-picker" style="height:350px;border-radius:12px;overflow:hidden;border:1.5px solid #CBD5E1;"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:0.75rem;">
    <div>
      <label style="font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-bottom:0.25rem;">ละติจูด (Lat)</label>
      <input id="pmp-lat" type="number" step="any" placeholder="13.7563" style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid #D1D5DB;border-radius:8px;font-size:0.9rem;">
    </div>
    <div>
      <label style="font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-bottom:0.25rem;">ลองจิจูด (Lng)</label>
      <input id="pmp-lng" type="number" step="any" placeholder="100.5018" style="width:100%;padding:0.5rem 0.75rem;border:1.5px solid #D1D5DB;border-radius:8px;font-size:0.9rem;">
    </div>
  </div>
  <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem;">
    <button class="btn btn-secondary" id="pmp-cancel" type="button">ยกเลิก</button>
    <button class="btn" id="pmp-confirm" type="button">✓ ใช้พิกัดนี้</button>
  </div>
</dialog>

<footer id="site-footer"></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/partner.js"></script>
</body>
</html>
