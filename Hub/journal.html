<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel journal — Travel and Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/journal.css">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>
<main class="section"><div class="container">
  <h1>Travel journal</h1>
  <p class="meta">Entries and photos are private. Only you can see them.</p>
  <div class="journal-bar">
    <div class="form-field"><label for="f-from">From</label><input id="f-from" type="date"></div>
    <div class="form-field"><label for="f-to">To</label><input id="f-to" type="date"></div>
    <div class="form-field"><label for="f-place">Destination</label><select id="f-place"><option value="">All</option></select></div>
    <button class="btn" id="new" type="button">New entry</button>
  </div>
  <p id="status" role="status" class="muted"></p>
  <div id="list" class="stack"></div>
</div></main>

<dialog id="editor" class="modal editor" aria-labelledby="ed-title">
  <h2 id="ed-title">New entry</h2>
  <div id="ed-msg" role="alert" hidden></div>
  <form id="ed-form" novalidate>
    <div class="form-field"><label for="ed-t">Title</label><input id="ed-t" required maxlength="150"></div>
    <div class="form-field"><label for="ed-d">Travel date</label><input id="ed-d" type="date" required></div>
    <div class="form-field"><label for="ed-m">Mood (optional)</label><input id="ed-m" maxlength="30" placeholder="e.g. happy, curious"></div>
    <div class="form-field"><label for="ed-b">Description</label><textarea id="ed-b" maxlength="5000"></textarea></div>
    <div class="form-field"><label for="ed-p">Destinations (hold Ctrl/Cmd to select several)</label><select id="ed-p" multiple size="5"></select></div>
    <div id="ed-existing" class="thumbs"></div>
    <div class="form-field"><label for="ed-f">Add photos (JPG, PNG, WebP, up to 5 MB each)</label>
      <input id="ed-f" type="file" accept="image/jpeg,image/png,image/webp" multiple></div>
    <div id="ed-new" class="stack"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-secondary" id="ed-cancel">Cancel</button>
      <button type="submit" class="btn" id="ed-save">Save</button>
    </div>
  </form>
</dialog>
<footer id="site-footer"></footer>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/journal-page.js"></script>
</body>
</html>
