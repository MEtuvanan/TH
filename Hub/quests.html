<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เควสท์ &amp; ภารกิจถ่ายรูปเช็คอิน — Travel and Challenge</title>
<meta name="description" content="พิชิตเควสท์ท่องเที่ยวจริงทั่วไทย ถ่ายรูปเช็คอินตามแลนด์มาร์กสำคัญ รับเหรียญโทเคน และปลดล็อกตัวละครสะสมสุดพิเศษ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/quests.css?v=3">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>

<!-- Hero Banner -->
<div class="quests-hero">
  <div class="container quests-hero-inner">
    <div class="quests-hero-text">
      <div class="hero-tag">
        <span class="pulse-dot"></span>
        <span id="hero-tag-txt">📸 เควสท์ถ่ายรูปเช็คอินสถานที่จริง</span>
      </div>
      <h1 id="quests-title">เควสท์ &amp; ภารกิจถ่ายรูปเช็คอิน</h1>
      <p class="lead" id="quests-subtitle">พิชิตเควสท์ท่องเที่ยวจริงทั่วไทย ถ่ายรูปเช็คอินตามจุดแลนด์มาร์กสำคัญเพื่อยืนยันภารกิจ รับเหรียญโทเคน และปลดล็อกตัวละครสะสมสุดพิเศษ!</p>
      <div style="margin-top:0.85rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
        <a href="/help.html#quests" class="btn btn-small" style="background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4);backdrop-filter:blur(8px);text-decoration:none;" target="_blank">📖 วิธีทำเควสท์ &amp; ถ่ายรูปเช็คอิน</a>
      </div>
    </div>
    <div class="quests-hero-stats">
      <div class="stat-pill"><span class="stat-icon">⚔️</span><span id="hero-stat-total">5 เควสท์</span></div>
      <div class="stat-pill gold"><span class="stat-icon">🪙</span><span id="hero-stat-tokens">สะสมโทเคน</span></div>
      <div class="stat-pill"><span class="stat-icon">🎭</span><span id="hero-stat-chars">ตัวละครสะสม</span></div>
    </div>
  </div>
</div>

<main class="quests-main section">
<div class="container">

  <!-- Tabs: All / In Progress / Completed -->
  <div class="quest-tabs" role="tablist" aria-label="กรองสถานะเควสท์">
    <button class="quest-tab active" id="tab-all" role="tab" aria-selected="true" data-tab="all">⚔️ <span id="tab-all-label">ทั้งหมด</span></button>
    <button class="quest-tab" id="tab-active" role="tab" aria-selected="false" data-tab="active">🔥 <span id="tab-active-label">กำลังทำ</span></button>
    <button class="quest-tab" id="tab-done" role="tab" aria-selected="false" data-tab="completed">✅ <span id="tab-done-label">สำเร็จแล้ว</span></button>
  </div>

  <!-- Search + Filters -->
  <form id="filters" class="quest-filters" aria-label="กรองเควสท์">
    <div class="quest-search-wrap">
      <span class="quest-search-icon">🔍</span>
      <input id="search" type="search" class="quest-search" placeholder="ค้นหาเควสท์หรือสถานที่..." autocomplete="off">
    </div>
    <div class="form-field">
      <label for="f-type" id="lbl-type">ประเภท</label>
      <select id="f-type">
        <option value="">ทุกประเภท</option>
      </select>
    </div>
    <div class="form-field">
      <label for="f-diff" id="lbl-diff">ระดับความยาก</label>
      <select id="f-diff">
        <option value="">ทุกระดับ</option>
        <option value="easy">🟢 ง่าย</option>
        <option value="medium">🟡 ปานกลาง</option>
        <option value="hard">🔴 ท้าทาย</option>
      </select>
    </div>
    <div class="form-field">
      <label for="f-place" id="lbl-place">สถานที่</label>
      <select id="f-place"><option value="">ทุกสถานที่</option></select>
    </div>
  </form>

  <p id="status" role="status" class="quests-status"></p>
  <div id="list" class="quest-grid"></div>

</div>
</main>

<!-- Quest Modal Dialog -->
<dialog id="quest-dialog" class="modal quest-modal" aria-labelledby="qd-title">
  <div class="quest-modal-header">
    <div class="qd-badges" id="qd-badges"></div>
    <h2 id="qd-title"></h2>
    <p id="qd-desc" class="qd-desc"></p>
    <p id="qd-reward" class="qd-reward"></p>
  </div>
  <div class="quest-modal-body">
    <p id="qd-instr" class="qd-instr"></p>
    <div id="qd-msg" role="alert" hidden></div>
    <form id="qd-form"></form>
  </div>
  <div class="modal-actions">
    <button type="button" class="btn btn-secondary" id="qd-close">✕ ปิดหน้าต่าง</button>
    <button type="submit" form="qd-form" class="btn" id="qd-submit">📤 ส่งคำตอบ</button>
  </div>
</dialog>

<footer id="site-footer"></footer>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/quests-page.js?v=gps1"></script>
</body>
</html>
