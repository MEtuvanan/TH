<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Trip Planner — Travel and Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/planner.css">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>
<main class="section"><div class="container wide">
  <h1>AI Trip Planner</h1>
  <p class="meta">Itineraries use only published, verified destinations. Times and order are estimates, not a verified route.</p>
  <div class="planner">
    <div class="stack">
      <form id="prefs" class="card" novalidate>
        <h2 style="font-size:1.25rem">Preferences <span class="meta">(all optional)</span></h2>
        <div class="form-field"><label for="p-area">Starting area</label><input id="p-area" maxlength="100" placeholder="e.g. Sukhumvit"></div>
        <div class="row2">
          <div class="form-field"><label for="p-date">Travel date</label><input id="p-date" type="date"></div>
          <div class="form-field"><label for="p-days">Days (1–7)</label><input id="p-days" type="number" min="1" max="7" value="1"></div>
        </div>
        <div class="row2">
          <div class="form-field"><label for="p-hours">Hours per day</label><input id="p-hours" type="number" min="2" max="14" value="6"></div>
          <div class="form-field"><label for="p-budget">Budget</label><select id="p-budget"><option value="">Any</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
        </div>
        <div class="row2">
          <div class="form-field"><label for="p-style">Travel style</label><select id="p-style"><option value="">Any</option><option>relaxed</option><option>balanced</option><option>adventurous</option><option>cultural</option><option>family</option></select></div>
          <div class="form-field"><label for="p-pace">Intensity</label><select id="p-pace"><option value="">Any</option><option>slow</option><option>moderate</option><option>fast</option></select></div>
        </div>
        <div class="form-field"><label for="p-transport">Transportation</label><select id="p-transport"><option value="">Any</option><option>walking</option><option>public</option><option>taxi</option><option>mixed</option></select></div>
        <div class="form-field"><label for="p-interests">Interests (comma separated)</label><input id="p-interests" maxlength="150" placeholder="temples, food, parks"></div>
        <div class="form-field"><label for="p-access">Accessibility needs</label><input id="p-access" maxlength="200"></div>
        <label class="check"><input id="p-quests" type="checkbox" checked> Include quests</label>
        <button class="btn" id="go" type="submit" style="width:100%;margin-top:1rem">Generate itinerary</button>
      </form>
      <section class="card"><h2 style="font-size:1.25rem">Saved trips</h2><ul id="saved" class="saved"></ul></section>
    </div>
    <div class="stack">
      <div id="msg" role="alert" hidden></div>
      <section id="result" class="card" hidden>
        <div class="form-field"><label for="t-title">Trip name</label><input id="t-title" maxlength="200"></div>
        <p id="summary"></p>
        <div id="days"></div>
        <div class="actions"><button class="btn" id="save" type="button">Save trip</button>
          <button class="btn btn-secondary" id="del" type="button" hidden>Delete trip</button></div>
        <p class="meta" id="notice"></p>
      </section>
      <div id="map-error" class="alert alert-error" role="alert" hidden></div>
      <div id="map" class="planner-map" hidden></div>
    </div>
  </div>
</div></main>
<footer id="site-footer"></footer>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/planner.js"></script>
</body>
</html>
