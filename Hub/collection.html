<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection — Travel and Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/collection.css">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>
<main class="section"><div class="container">
  <h1>Collection</h1>
  <p id="status" role="status" class="muted">Loading…</p>
  <div id="content" hidden>
    <div class="card balance"><span class="meta">Token balance</span><strong id="balance">0</strong>
      <span class="meta" id="progress"></span></div>
    <h2>Characters</h2>
    <div id="characters" class="grid grid-4"></div>
    <h2>Achievements</h2>
    <div id="achievements" class="grid grid-3"></div>
    <h2>Reward history</h2>
    <div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Source</th><th>Tokens</th></tr></thead><tbody id="history"></tbody></table></div>
  </div>
</div></main>
<footer id="site-footer"></footer>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/collection.js"></script>
</body>
</html>
