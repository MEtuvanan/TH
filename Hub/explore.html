<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Small screens get the full-screen map layout. Add ?desktop=1 to keep this page.
  if (matchMedia('(max-width: 767px)').matches && !/[?&]desktop=1/.test(location.search)) {
    location.replace('/explore-mobile.html' + location.search + location.hash);
  }
</script>
<title>สำรวจสถานที่ท่องเที่ยว — Travel and Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/explore.css">
<link rel="stylesheet" href="/css/components/ai-planner-modal.css">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>
<main class="explore">
  <header class="explore-header" style="background:#fff;border-bottom:1px solid var(--color-border);padding:1.1rem 4%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;">
    <div>
      <h1 style="font-size:1.4rem;margin:0;color:var(--color-forest);font-weight:800;">🗺️ สำรวจสถานที่ท่องเที่ยวทั่วไทย (Explore)</h1>
      <p style="margin:0.25rem 0 0;font-size:0.875rem;color:var(--color-text-muted);">ค้นหาและปักหมุดจุดหมายกว่า 50 แห่งทั่วไทย พร้อมระบบนำทาง GPS แนะนำการเดินทาง และเควสท์รับเหรียญ</p>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center;">
      <a href="/help.html#explore" class="btn btn-small btn-secondary" style="font-size:0.85rem;">📖 คู่มือการสำรวจ</a>
    </div>
  </header>
  <form id="filters" class="filters" role="search" aria-label="ค้นหาสถานที่ท่องเที่ยว">
    <div class="search-bar-row">
      <div class="search-input-wrap">
        <span class="search-input-icon">🔍</span>
        <input id="search" type="search" maxlength="80" placeholder="ค้นหาชื่อสถานที่ท่องเที่ยว, วัด, ตลาด, คาเฟ่, ธรรมชาติ…" autocomplete="off">
        <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="ล้างคำค้นหา" hidden>✕</button>
      </div>
    </div>
  </form>
  <div class="explore-body">
    <section class="list-pane" aria-label="Destinations">
      <p id="status" role="status" class="meta"></p>
      <ul id="list" class="place-list"></ul>
    </section>
    <section class="map-pane" aria-label="Map of Thailand">
      <div id="map-error" class="alert alert-error" role="alert" hidden></div>
      <div id="map" class="map"></div>
    </section>
  </div>
</main>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/explore.js?v=2"></script>
</body>
</html>
