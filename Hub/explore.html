<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สำรวจสถานที่ท่องเที่ยว — Travel and Challenge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/desktop.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/pages/explore.css">
<link rel="stylesheet" href="/css/components/ai-planner-modal.css">
</head>
<body data-protected="true">
<nav id="site-nav" aria-label="Main"></nav>
<main class="explore">
  <form id="filters" class="filters" role="search" aria-label="Filter destinations">
    <div class="form-field"><label for="search">Search</label><input id="search" type="search" maxlength="80" placeholder="Temple, market…"></div>
    <div class="form-field"><label for="province">Province</label><select id="province"></select></div>
    <div class="form-field"><label for="district">District</label><select id="district"></select></div>
    <div class="form-field"><label for="category">Category</label><select id="category"></select></div>
  </form>
  <div class="explore-body">
    <section class="list-pane" aria-label="Destinations">
      <p id="status" role="status" class="meta"></p>
      <ul id="list" class="place-list"></ul>
    </section>
    <section class="map-pane" aria-label="Map of Thailand">
      <div id="map-error" class="alert alert-error" role="alert" hidden></div>
      <div id="map" class="map"></div>
    </section>
  </div>
</main>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/explore.js"></script>
</body>
</html>
