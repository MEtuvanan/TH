<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>นำทาง GPS — Travel and Challenge</title>
<meta name="description" content="ระบบนำทาง GPS พร้อม turn-by-turn ภาษาไทย ไปยังสถานที่ท่องเที่ยวทั่วไทย">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/pages/navigate.css">
</head>
<body data-protected="true">

<!-- Top Bar -->
<header class="nav-topbar" id="nav-topbar">
  <a class="nav-back" href="javascript:history.back()" id="btn-back" aria-label="กลับ">
    <span class="nav-back-icon">←</span>
    <span id="back-label">กลับ</span>
  </a>
  <div class="nav-dest-info">
    <span class="nav-dest-name" id="dest-name">กำลังโหลด…</span>
    <span class="nav-dest-sub" id="dest-sub"></span>
  </div>
  <button class="nav-icon-btn" id="btn-voice" title="เปิด/ปิดเสียงนำทาง" aria-pressed="true" aria-label="เปิด/ปิดเสียงนำทาง"><svg class="ic" width="18" height="18"><use href="/assets/icons/sprite.svg#i-volume"></use></svg></button>
</header>

<!-- Map Container -->
<div id="nav-map" class="nav-map" role="img" aria-label="แผนที่นำทาง"></div>

  <!-- GPS Status Banner -->
<div class="gps-status-bar" id="gps-bar" hidden>
  <span class="gps-icon" id="gps-icon"><svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-gps"></use></svg></span>
  <span id="gps-msg">กำลังหาตำแหน่ง GPS…</span>
</div>

<!-- Turn-by-Turn Card (floats above bottom panel) -->
<div class="turn-card" id="turn-card" hidden>
  <div class="turn-arrow" id="turn-arrow">↑</div>
  <div class="turn-info">
    <div class="turn-dist" id="turn-dist"></div>
    <div class="turn-street" id="turn-street"></div>
  </div>
  <div class="turn-next" id="turn-next-icon">→</div>
</div>

<!-- Bottom Panel -->
<div class="nav-bottom" id="nav-bottom">
  <!-- ETA Strip -->
  <div class="nav-eta-strip">
    <div class="eta-item">
      <span class="eta-value" id="eta-time">—</span>
      <span class="eta-label">เวลาถึง</span>
    </div>
    <div class="eta-divider"></div>
    <div class="eta-item">
      <span class="eta-value" id="eta-dist">—</span>
      <span class="eta-label">ระยะทาง</span>
    </div>
    <div class="eta-divider"></div>
    <div class="eta-item">
      <span class="eta-value" id="eta-dur">—</span>
      <span class="eta-label">ระยะเวลา</span>
    </div>
  </div>

  <!-- Steps List -->
  <div class="steps-wrap" id="steps-wrap">
    <div id="steps-list" class="steps-list"></div>
  </div>

  <!-- Action Buttons -->
  <div class="nav-actions">
    <button class="nav-btn nav-btn-secondary" id="btn-center" type="button"><svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-gps"></use></svg> ตำแหน่งฉัน</button>
    <button class="nav-btn nav-btn-secondary" id="btn-overview" type="button"><svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-map"></use></svg> ภาพรวม</button>
    <button class="nav-btn nav-btn-secondary" id="btn-simulate" type="button"><svg class="ic" width="14" height="14" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-navigate"></use></svg> จำลองเดินทาง</button>
    <button class="nav-btn nav-btn-danger" id="btn-stop" type="button"><svg class="ic" width="14" height="14" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-close"></use></svg> หยุดนำทาง</button>
  </div>
</div>

<!-- Start Screen (before GPS lock) -->
<div class="start-overlay" id="start-overlay">
  <div class="start-card">
    <div class="start-icon"><svg class="ic" width="36" height="36" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-compass"></use></svg></div>
    <h2 id="start-title">นำทางไปยัง</h2>
    <p class="start-dest" id="start-dest-name"></p>
    <p class="start-hint" id="start-hint">กด "เริ่มนำทาง" เพื่ออนุญาตการเข้าถึง GPS และเริ่มต้นการนำทาง</p>
    <div class="start-mode-row">
      <button class="mode-btn active" data-mode="driving" type="button"><svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-navigate"></use></svg> รถยนต์</button>
      <button class="mode-btn" data-mode="walking" type="button"><svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-user"></use></svg> เดินเท้า</button>
      <button class="mode-btn" data-mode="cycling" type="button"><svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-bike"></use></svg> จักรยาน</button>
    </div>
    <button class="btn btn-large" id="btn-start-nav" type="button"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-compass"></use></svg> เริ่มนำทาง</button>
    <a class="start-gmaps-link" id="gmaps-link" href="#" target="_blank" rel="noopener noreferrer">
      <svg class="ic" width="16" height="16" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-external"></use></svg> เปิดใน Google Maps แทน
    </a>
  </div>
</div>

<!-- Arrived Overlay -->
<div class="arrived-overlay" id="arrived-overlay" hidden>
  <div class="arrived-card">
    <div class="arrived-icon"><svg class="ic" width="40" height="40" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-trophy"></use></svg></div>
    <h2>ถึงที่หมายแล้ว!</h2>
    <p id="arrived-dest"></p>
    <div class="arrived-actions">
      <a class="btn" id="arrived-view" href="#">ดูข้อมูลสถานที่</a>
      <button class="btn btn-secondary" id="arrived-close" type="button"><svg class="ic" width="14" height="14" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-close"></use></svg> ปิด</button>
    </div>
  </div>
</div>

<script type="module" src="/js/navigate.js"></script>
</body>
</html>
